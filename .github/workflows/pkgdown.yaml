name: pkgdown

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build pkgdown site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site from committed documentation
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Add canonical page metadata
        run: Rscript pkgdown/add-canonical-metadata.R

      - name: Validate generated site
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/reference/index.html
          test -f docs/reference/soundex.html
          test -f docs/articles/phonics.html
          test -f docs/authors.html
          test -f docs/jh-badge-1x1.svg
          grep -q 'rel="canonical" href="https://phonics.jameshoward.us/"' docs/index.html
          grep -q 'property="og:url" content="https://phonics.jameshoward.us/"' docs/index.html
          grep -q 'rel="canonical" href="https://phonics.jameshoward.us/reference/soundex.html"' docs/reference/soundex.html
          grep -q 'property="og:url" content="https://phonics.jameshoward.us/reference/soundex.html"' docs/reference/soundex.html
          grep -q 'rel="canonical" href="https://phonics.jameshoward.us/articles/phonics.html"' docs/articles/phonics.html
          grep -q 'https://phonics.jameshoward.us' docs/sitemap.xml
          grep -q 'src="https://phonics.jameshoward.us/jh-badge-1x1.svg"' docs/index.html
          grep -q 'src="https://phonics.jameshoward.us/jh-badge-1x1.svg"' docs/reference/soundex.html
          grep -q 'src="https://phonics.jameshoward.us/jh-badge-1x1.svg"' docs/articles/phonics.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = (
              Path("docs/index.html"),
              Path("docs/reference/soundex.html"),
              Path("docs/articles/phonics.html"),
          )
          forbidden = (
              "jh-site-legal",
              "Disclosure Statement",
              "Terms of Use",
              "Privacy Notice",
              "Cookie Settings",
          )

          for page in pages:
              html = page.read_text(encoding="utf-8")
              identity = re.search(
                  r'<span class="jh-site-identity">.*?</span></span>',
                  html,
                  flags=re.DOTALL,
              )
              assert identity is not None, f"Missing site identity in {page}"
              identity_html = identity.group(0)
              assert "phonics.jameshoward.us" in identity_html, (
                  f"Incorrect site identity in {page}"
              )
              assert "A website of " in identity_html, (
                  f"Missing site tagline in {page}"
              )
              links = re.findall(
                  r'<a\b[^>]*\bhref="([^"]+)"[^>]*>(.*?)</a>',
                  identity_html,
                  flags=re.DOTALL,
              )
              assert len(links) == 2, f"Expected exactly two identity links in {page}"
              assert all(href == "https://jameshoward.us" for href, _ in links), (
                  f"Incorrect identity link target in {page}"
              )
              badge_links = [body for _, body in links if "<img" in body]
              assert len(badge_links) == 1, f"Badge is not singly linked in {page}"
              text_links = [
                  re.sub(r"<[^>]+>", "", body).strip() for _, body in links
                  if "<img" not in body
              ]
              assert text_links == ["James Howard"], (
                  f"James Howard text is not singly linked in {page}"
              )
              linked_text = [
                  re.sub(r"<[^>]+>", "", body).strip() for _, body in links
              ]
              assert all("phonics.jameshoward.us" not in text for text in linked_text), (
                  f"Phonics domain must remain unlinked in {page}"
              )
              for text in forbidden:
                  assert text not in html, f"Forbidden footer text {text!r} in {page}"
          PY
          if grep -R -F 'jameshoward.us/phonics-in-r' docs; then
            echo 'Legacy canonical URL remains in the generated site.' >&2
            exit 1
          fi

      - name: Upload site for validation
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site-${{ github.run_id }}
          path: docs
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
